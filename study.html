    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', savedTheme || (systemPrefersDark ? 'dark' : 'light'));
        })();
    </script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

    <link rel="stylesheet" href="css/fonts.css?v=20260714h">
    <link rel="stylesheet" href="css/student-portal.css?v=20260729m">
    <style>
        /* On-demand dashboard — reuses the portal theme tokens (bg-secondary /
           text-primary / …) so it tracks light & dark automatically. */
        .sd-hello { font-size: 1.15rem; margin: 4px 0 18px; color: var(--text-primary, #111); }
        .sd-section-title { font-size: 1.15rem; font-weight: 700; margin: 26px 0 14px; display: flex; align-items: center; gap: 9px; color: var(--text-primary, #111); }
        .sd-section-title i { color: #ff5a1f; }
        .sd-section-sub { color: var(--text-secondary, #777); font-size: .9rem; margin: -6px 0 12px; }
        .sd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .sd-card { background: var(--bg-secondary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 16px; padding: 18px; }
        .sd-card__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .sd-card__title { font-size: 1rem; font-weight: 700; margin: 0; color: var(--text-primary, #111); }
        .sd-pct { font-weight: 800; color: #ff5a1f; font-variant-numeric: tabular-nums; }
        .sd-bar { height: 8px; border-radius: 999px; background: var(--bg-tertiary, #eef0f3); overflow: hidden; margin: 12px 0 10px; }
        .sd-bar span { display: block; height: 100%; background: linear-gradient(90deg, #ff7a3c, #ff5a1f); border-radius: 999px; transition: width .4s; }
        .sd-card__meta { color: var(--text-secondary, #777); font-size: .85rem; margin-bottom: 14px; }
        .sd-card__meta i { color: #ff5a1f; opacity: .85; margin-right: 2px; }
        .sd-btn { display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; text-decoration: none;
            background: #ff5a1f; color: #fff; font-weight: 600; font-size: .9rem; padding: 9px 16px; border-radius: 10px; font-family: inherit; }
        .sd-btn:hover { filter: brightness(1.05); }
        .sd-btn--sm { padding: 7px 13px; font-size: .85rem; }
        .sd-btn--ghost { background: transparent; color: var(--text-primary, #333); border: 1px solid var(--border-color, #ddd); }
        .sd-btn--danger { background: transparent; color: #dc2626; border: 1px solid rgba(220,38,38,.4); }
        .sd-rec-list { display: flex; flex-direction: column; gap: 12px; }
        .sd-rec { display: flex; align-items: center; gap: 14px; background: var(--bg-secondary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 14px; padding: 14px 16px; }
        .sd-rec__body { flex: 1; min-width: 0; }
        .sd-rec__title { margin: 0; font-size: .98rem; font-weight: 700; color: var(--text-primary, #111); }
        .sd-rec__desc { margin: 4px 0 0; color: var(--text-secondary, #777); font-size: .85rem; }
        .sd-rec__meta { margin-top: 6px; font-size: .82rem; color: #ff5a1f; font-weight: 600; }
        .sd-rec__was { color: var(--text-secondary, #999); font-weight: 500; text-decoration: line-through; }
        .sd-rec__off { color: #fff; background: #e0245e; font-size: .7rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
        .sd-rec__plus { display: inline-flex; align-items: center; gap: 4px; font-size: .66rem; font-weight: 800; color: #8a5a00; background: linear-gradient(120deg,#ffe9a8,#ffd564); padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
        .sd-rec__soon { display: inline-flex; align-items: center; gap: 4px; color: #2563eb; font-weight: 700; }
        /* To-do */
        .sd-todo-head { display: flex; align-items: center; gap: 8px; }
        .sd-icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-secondary, #888); font-size: .95rem; padding: 4px; }
        .sd-icon-btn:hover { color: #ff5a1f; }
        .sd-todo-list { display: flex; flex-direction: column; gap: 10px; }
        .sd-todo { display: flex; align-items: center; gap: 13px; background: var(--bg-secondary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 13px; padding: 12px 15px; }
        .sd-todo.is-locked { opacity: .6; }
        .sd-todo__icon { flex: 0 0 34px; height: 34px; width: 34px; border-radius: 10px; background: var(--bg-tertiary, #f1f3f7); color: #ff5a1f; display: flex; align-items: center; justify-content: center; }
        .sd-todo__main { flex: 1; min-width: 0; }
        .sd-todo__title { font-weight: 600; color: var(--text-primary, #111); }
        .sd-todo__meta { font-size: .8rem; color: var(--text-secondary, #888); margin-top: 2px; }
        .sd-lock { color: var(--text-secondary, #aaa); padding: 0 6px; }
        /* Profile */
        .sd-profile { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--bg-secondary, #fff);
            border: 1px solid var(--border-color, #e5e7eb); border-radius: 18px; padding: 20px; }
        .sd-avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; flex: 0 0 76px; }
        .sd-avatar--initial { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#ff7a3c,#ff5a1f); color: #fff; font-size: 2rem; font-weight: 800; }
        .sd-profile__info { flex: 1; min-width: 160px; }
        .sd-profile__name { font-size: 1.3rem; font-weight: 800; color: var(--text-primary, #111); }
        .sd-profile__email { color: var(--text-secondary, #888); font-size: .9rem; margin-top: 2px; }
        .sd-profile__stats { display: flex; gap: 18px; margin-top: 10px; font-size: .88rem; color: var(--text-secondary, #666); flex-wrap: wrap; }
        .sd-profile__stats strong { color: #ff5a1f; }
        .sd-profile__actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .sd-receipts { display: flex; flex-direction: column; gap: 10px; }
        .sd-receipt { display: flex; align-items: center; gap: 12px; background: var(--bg-secondary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 13px; padding: 12px 15px; }
        .sd-receipt__main { flex: 1; min-width: 0; }
        .sd-receipt__title { font-weight: 600; color: var(--text-primary, #111); }
        .sd-receipt__meta { font-size: .8rem; color: var(--text-secondary, #888); }
        .sd-receipt__amt { font-weight: 700; color: var(--text-primary, #111); font-variant-numeric: tabular-nums; }
        .sd-muted { color: var(--text-secondary, #aaa); }
        .sd-settings { display: flex; flex-direction: column; gap: 14px; }
        .sd-setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--bg-secondary, #fff);
            border: 1px solid var(--border-color, #e5e7eb); border-radius: 14px; padding: 16px 18px; }
        .sd-setting__title { font-weight: 700; color: var(--text-primary, #111); }
        .sd-setting__sub { font-size: .84rem; color: var(--text-secondary, #888); margin-top: 3px; max-width: 46ch; }
        .sd-badge { flex: 0 0 auto; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--bg-tertiary, #f1f3f7); color: var(--text-secondary, #888); }
        .sd-badge--soon { background: rgba(255,90,31,.12); color: #ff5a1f; margin-left: 8px; vertical-align: middle; }
        .sd-soon { border-style: dashed; }
        .sd-soon .sd-setting__title { color: var(--text-secondary, #777); }
        .sd-btn:disabled { opacity: .5; cursor: not-allowed; }
        .sd-btn--lg { padding: 13px 22px; font-size: 1rem; border-radius: 12px; }
        /* Account menu */
        .sd-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .sd-menu-item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
            background: var(--bg-secondary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 14px;
            padding: 15px 16px; cursor: pointer; font-family: inherit; color: var(--text-primary, #111); transition: border-color .15s, transform .1s; }
        button.sd-menu-item:hover { border-color: #ff5a1f; }
        button.sd-menu-item:active { transform: scale(.995); }
        .sd-menu-item--static { cursor: default; }
        .sd-menu-item--danger { color: #dc2626; }
        .sd-menu-item__icon { flex: 0 0 40px; height: 40px; width: 40px; border-radius: 11px; background: var(--bg-tertiary, #f1f3f7);
            color: #ff5a1f; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .sd-menu-item--danger .sd-menu-item__icon { color: #dc2626; background: rgba(220,38,38,.1); }
        .sd-menu-item__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .sd-menu-item__title { font-weight: 600; }
        .sd-menu-item__sub { font-size: .82rem; color: var(--text-secondary, #888); margin-top: 2px; }
        .sd-menu-item__chev { color: var(--text-secondary, #bbb); font-size: .85rem; }
        .sd-back { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer;
            color: var(--text-secondary, #777); font-weight: 600; font-size: .92rem; padding: 4px 0; margin-bottom: 8px; font-family: inherit; }
        .sd-back:hover { color: #ff5a1f; }
        /* Promo (home, not enrolled) */
        .sd-promo { background: linear-gradient(135deg, rgba(255,122,60,.12), rgba(255,90,31,.06));
            border: 1px solid rgba(255,90,31,.25); border-radius: 20px; padding: 30px 26px; }
        .sd-promo__eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; color: #ff5a1f; }
        .sd-promo__title { font-size: 1.6rem; font-weight: 800; margin: 10px 0 8px; color: var(--text-primary, #111); line-height: 1.25; }
        .sd-promo__sub { color: var(--text-secondary, #666); margin: 0 0 20px; max-width: 52ch; line-height: 1.6; }
        .sd-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
        .sd-step { display: flex; align-items: center; gap: 12px; background: var(--bg-secondary, #fff);
            border: 1px solid var(--border-color, #e5e7eb); border-radius: 14px; padding: 14px 16px; }
        .sd-step__n { flex: 0 0 30px; height: 30px; width: 30px; border-radius: 50%; background: #ff5a1f; color: #fff;
            font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .sd-step div { display: flex; flex-direction: column; }
        .sd-step strong { color: var(--text-primary, #111); font-size: .95rem; }
        .sd-step span { color: var(--text-secondary, #888); font-size: .8rem; }
        .sd-empty { text-align: center; padding: 46px 20px; color: var(--text-secondary, #888); }
        .sd-empty i { font-size: 2.2rem; opacity: .5; display: block; margin-bottom: 12px; }
        .sd-empty p { font-weight: 600; margin: 0 0 14px; color: var(--text-primary, #333); }
    </style>
</head>
